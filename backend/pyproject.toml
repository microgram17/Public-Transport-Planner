[project]
name = "Public-Transport-Planner"
version = "0.1.0"
description = "Backend for the Public Transport Planner application"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.5",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.10.1",
    "psycopg[binary,pool]>=3.3.5",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.lint]
extend-select = ["FAST"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = [
    "integration: requires TEST_DATABASE_URL and replaces data in its gtfs schema",
]
